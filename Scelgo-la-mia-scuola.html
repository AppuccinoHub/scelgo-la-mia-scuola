:root{--cream:#F7F4EE;--paper:#FFFFFF;--navy:#0E2A5B;--navy2:#2A4378;--coral:#F26B3A;--coral-l:#FDE6DC;--line:#DAD7D0;--ok:#1D6B39;--ok-l:#E3F1E7;--info:#E8EEF8;--hl:#FFE9A8;--fs:19px;--lh:1.55;--ls:0;--ws:0}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--navy);font-family:'Manrope',system-ui,'Segoe UI',Roboto,Arial,sans-serif;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws)}
body.pB{--fs:21px;--lh:1.95;--ls:.03em;--ws:.14em;font-family:'Lexend','Verdana',system-ui,sans-serif;--cream:#F9F3E4}
body.pC{--fs:21px}
h1,h2,h3,.bk{font-family:'Bricolage Grotesque','Manrope',system-ui,sans-serif;font-weight:800;line-height:1.15;letter-spacing:-.01em;margin:0 0 .4em}
body.pB h1,body.pB h2,body.pB h3,body.pB .bk{font-family:'Lexend','Verdana',sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:2rem}h2{font-size:1.6rem}h3{font-size:1.2rem}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--navy);font-weight:700}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px 56px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 8px;flex-wrap:wrap}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:10px}
body.pB .brand{font-family:'Lexend',sans-serif}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--coral)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{display:inline-block;background:var(--navy);color:var(--cream);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:800}
.tbtn{min-width:44px;min-height:44px;border:2px solid var(--navy);background:var(--paper);border-radius:12px;font-weight:800;cursor:pointer}
.dots{display:flex;gap:7px;flex-wrap:wrap;padding:2px 0 12px}
.dots button{width:36px;height:36px;border-radius:50%;border:2px solid var(--navy);background:var(--paper);font-weight:800;font-size:.85rem;cursor:pointer;padding:0}
.dots button.cur{background:var(--navy);color:var(--cream)}
.dots button.done{background:var(--coral);border-color:var(--coral)}
.dots button.done.cur{background:var(--navy);border-color:var(--navy)}
.dots button:disabled{opacity:.5;cursor:default}
.card{background:var(--paper);border:2px solid var(--navy);border-radius:20px;padding:22px;box-shadow:6px 6px 0 rgba(14,42,91,.14);margin-bottom:18px}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.stepbar .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.05rem}
body.pB .stepbar .big{font-family:'Lexend'}
.tm{background:var(--coral-l);border:2px solid var(--coral);border-radius:999px;padding:1px 12px;font-weight:700;font-size:.85rem}
.dir{display:grid;gap:8px;margin:12px 0 16px}
.dir div{border-left:6px solid var(--coral);background:var(--cream);padding:8px 14px;border-radius:0 12px 12px 0}
.dir b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy2)}
body.pB .dir b{letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:16px;border:2px solid var(--navy);background:var(--navy);color:var(--cream);font-weight:800;cursor:pointer;font-size:1rem;text-decoration:none}
.btn:hover{background:var(--navy2)}
.btn.sec{background:var(--paper);color:var(--navy)}.btn.sec:hover{background:var(--cream)}
.btn.co{background:var(--coral);border-color:var(--navy);color:var(--navy)}.btn.co:hover{background:#ff7d50}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.9rem;border-radius:14px}
:focus-visible{outline:4px solid #E0A100;outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.chk{display:flex;gap:12px;align-items:center;padding:14px 16px;border:2px solid var(--navy);border-radius:16px;background:var(--cream);font-weight:800;cursor:pointer;margin-top:16px}
.chk input{width:28px;height:28px;accent-color:var(--navy);flex:none}
.chk.on{background:var(--ok-l);border-color:var(--ok)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sc{border:2px solid var(--navy);border-radius:20px;background:var(--paper);padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.sc img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:var(--cream)}
.sc.sel{background:var(--coral-l);border-color:var(--coral);box-shadow:0 0 0 4px var(--coral) inset}
.sc small{display:block;font-weight:600}
.sc .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.1rem;line-height:1.2}
body.pB .sc .nm{font-family:'Lexend'}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:6px 16px;border:2px solid var(--navy);background:var(--paper);border-radius:999px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--navy);color:var(--cream)}
.chip:disabled{opacity:.4}
label.f{display:block;font-weight:800;margin:14px 0 4px}
input[type=text],textarea,select{width:100%;border:2px solid var(--navy);border-radius:14px;background:#fff;padding:10px 12px;font-size:1rem}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.hint{font-size:.88rem;color:var(--navy2);font-weight:600}
.fb{margin-top:8px;padding:10px 14px;border-radius:14px;border:2px solid var(--navy);background:var(--info)}
.fb.ok{background:var(--ok-l);border-color:var(--ok)}
.fb.why{background:var(--coral-l);border-color:var(--coral)}
.fb b{font-weight:800}
.kt{background:var(--hl);border-radius:6px;padding:0 5px;font-weight:800;cursor:pointer;border-bottom:3px solid #E0A100}
body.pB .kt{padding:1px 6px}
.kt.noaudio{cursor:default}
.slide{border:2px solid var(--navy);border-radius:18px;background:var(--cream);padding:14px 16px;margin-bottom:14px}
.slide h3{display:flex;gap:10px;align-items:center;margin-bottom:.3em}
.slide .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font-size:.95rem}
.ln{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.ln .it{font-weight:700;font-size:1.08rem}
.ln .en{display:block;font-size:.88rem;font-weight:600;color:var(--navy2);margin-top:2px}
.say{flex:none;min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--navy);background:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0}
.say svg{width:22px;height:22px}
.say[disabled]{opacity:.35;cursor:not-allowed}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.card{padding:16px}h1{font-size:1.6rem}}
@media(max-width:420px){.grid{grid-template-columns:1fr}html{font-size:18px}body.pB,body.pC{--fs:19px}}
.hero{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{max-width:200px}}
.hero img{width:100%;border-radius:20px}
.pick{display:grid;gap:12px;margin-top:14px}
.pick button{text-align:left;border:2px solid var(--navy);background:var(--paper);border-radius:18px;padding:14px 18px;cursor:pointer;display:flex;gap:14px;align-items:center;font-weight:700}
.pick button b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.3rem}
.pick .ltr{flex:none;width:52px;height:52px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.4rem}
.rec{border:2px dashed var(--navy);border-radius:16px;padding:12px;margin-top:10px;background:var(--paper)}
.rec .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--coral)}
.dot.live{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot.live{animation:none}}
.mic{background:var(--coral-l);border:2px solid var(--coral);border-radius:14px;padding:10px 14px;margin-top:8px}
ol.steps{padding-left:1.3em;margin:6px 0}ol.steps li{margin:6px 0}
.tl{display:grid;gap:10px}
.tl .it{display:flex;gap:12px;align-items:flex-start}
.tl .nn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font-weight:800}
.cardnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.fact{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media(max-width:700px){.fact{grid-template-columns:1fr}.fact img{max-width:220px}}
.fact img{width:100%;border-radius:18px;border:2px solid var(--navy)}
details{border:2px solid var(--line);border-radius:14px;padding:8px 14px;background:var(--paper);margin-top:10px}
summary{cursor:pointer;font-weight:800;min-height:36px}
.small{font-size:.9rem}
.sr{position:absolute;left:-9999px}
.ex{background:#fff;border:2px dashed var(--coral);border-radius:16px;padding:10px 14px;margin-top:12px}
.ex .ex-h{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);display:block;margin-bottom:4px}
.sign{border:2px solid var(--navy);border-radius:16px;padding:12px 16px;margin-top:12px;background:var(--cream)}
.sign.ok{background:var(--ok-l);border-color:var(--ok)}
.tpanel{border:2px dashed var(--navy);border-radius:16px;padding:12px;margin:8px 0;background:#fff}
.accbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.accbar button{min-width:44px;min-height:44px;border:2px solid var(--navy);background:#fff;border-radius:10px;font-weight:800;font-size:1.1rem;cursor:pointer}
.tag{display:inline-block;background:var(--cream);border:2px solid var(--navy);border-radius:999px;padding:0 10px;font-size:.78rem;font-weight:800}
.mb{margin-bottom:12px}
.center{text-align:center}
.live{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;background:var(--navy);color:var(--cream);padding:10px 18px;border-radius:14px;z-index:20;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.live.show{display:block}
mark.kt{color:var(--navy)}
#main:focus{outline:none}
[hidden]{display:none!important}
[tabindex="-1"]:focus{outline:none}
/* research step */
.rsl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:10px 0}
.rs{border:2px solid var(--navy);border-radius:16px;background:var(--paper);padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rsh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rs .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.05rem;line-height:1.2}
body.pB .rs .nm{font-family:'Lexend'}
.bdg{display:inline-block;border-radius:999px;border:2px solid var(--navy);padding:0 10px;font-size:.78rem;font-weight:800;background:var(--info)}
.bdg.p{background:var(--hl)}.bdg.f{background:var(--ok-l)}
.rs p{margin:0}
.flg{background:var(--cream);border-left:5px solid var(--navy2);padding:4px 8px;border-radius:0 8px 8px 0}
.fw{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.fw .chk{flex:1;margin:0}
.qbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--info);border:2px solid var(--navy);border-radius:14px;padding:10px 12px;margin:10px 0}
.rex{margin-top:2px}
.chk.big{padding:14px;border-width:3px}
.fw .chk{padding:8px 12px;gap:10px;align-items:flex-start;font-weight:600}
.fw .chk input{margin-top:3px}
.fw .say{flex:none}
@media(max-width:420px){.fw{flex-direction:column;gap:2px;margin:10px 0}.fw .chk{width:100%}}
.fl{margin:8px 0 4px;font-size:.95em}
.fln{margin:6px 0}
.fln .tag{display:inline-block;font-weight:800;color:#8A3D1B;background:#FDE6DC;border-radius:8px;padding:1px 8px;margin-right:6px;font-size:.88em}
.glw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
.gl{border-collapse:collapse;min-width:640px;font-size:.92em}
.gl th,.gl td{border:2px solid #E9D5C8;padding:6px 8px;text-align:left;vertical-align:top}
.gl thead th{background:#FDE6DC}
.athome{margin-top:18px;opacity:.95}
.athome summary{font-size:.9em}
.rs .ln,.rs .fl{width:100%}

/* ========= Explainer cards (English, key Italian terms in {{it|en}}) ========= */
var CARDS=[
 {t:'At 13 to 14, students pick a high school',
  a:'Students in Italy finish {{le medie|middle school}} (the {{scuola secondaria di primo grado}}) at about 13 to 14. Next comes the {{scuola secondaria di secondo grado}}, also called {{le superiori|high school}}. Students pick a TYPE of school, not just classes. There are four families: {{licei}} (5 years, wide cultural education, mostly preparing for university), {{istituti tecnici}} (5 years, theory plus technical skills), {{istituti professionali}} (5 years, practical, linked to trades and professions) and {{IeFP}} (3 or 4 years, regional vocational training).',
  b:'Students finish {{le medie}} at about 13 to 14. Then they pick a type of high school ({{le superiori}}): {{licei}}, {{istituti tecnici}}, {{istituti professionali}} or {{IeFP}}.',
  c:'About 13 to 14: finish {{le medie}}. Then pick a high school: {{le superiori}}.',art:'scelta'},
 {t:'Fall of terza media: look around and get advice',
  a:'In {{terza media}} (the last year of middle school), students visit schools. Many schools hold an {{open day}} (also called {{scuole aperte}}), usually between November and January. Each school sets its own dates. The class teachers (the {{consiglio di classe}}) also give every student a {{consiglio di orientamento}}: advice about which kind of school might fit. It is only advice. A school cannot refuse a student because of it, and the family makes the final choice.',
  b:'In {{terza media}}, students visit schools at an {{open day}}. The teachers give a {{consiglio di orientamento}}: advice only. The family decides.',
  c:'Visit schools: {{open day}}. Teachers give advice: {{consiglio di orientamento}}. The family decides.',art:'lingue'},
 {t:'January and February: sign up online',
  a:'Parents or guardians (not the student) fill out the {{iscrizione|sign-up}} online on the Ministry of Education platform, {{Unica}} (unica.istruzione.gov.it), using a digital ID ({{SPID}} or {{CIE}}). For the 2026/27 school year, the window ran from 13 January to 14 February 2026. The dates are announced each year. The family picks one first-choice school and can add up to two backup schools.',
  b:'In January to February, parents sign up online ({{iscrizione}}) on {{Unica}}. One first choice, plus up to two backups.',
  c:'January to February: parents sign up online ({{iscrizione}}). One first choice. Two backups.',art:'informatica'},
 {t:'How a school accepts students',
  a:'Public high schools do not give an entrance assessment. The one exception is the {{liceo musicale e coreutico}} (music and dance): students show their skills in a {{prova|audition}} first. If a school gets more applications than it has places, it uses published rules (for example, how close the student lives). A lottery is the last resort.',
  b:'No entrance assessment, except the {{liceo musicale e coreutico}}: it has a {{prova}} (audition) in music or dance.',
  c:'No entrance assessment. Only music and dance has a {{prova}} (audition).',art:'musica'},
 {t:'June: the esame di terza media',
  a:'In June, students finish middle school with the {{esame di terza media}} (officially the {{esame di Stato}} of the first cycle): three written papers (Italian, mathematics, foreign languages) and one oral interview ({{colloquio}}). Passing means a final grade of at least 6 out of 10. Families sign up for high school in January and February, so they sign up before the {{esame}}.',
  b:'June: the {{esame di terza media}}. Three written papers and one oral interview ({{colloquio}}). Pass: 6 out of 10.',
  c:'June: the {{esame di terza media}}: 3 written papers and 1 oral interview.',art:'economia'},
 {t:'School is required until 16, and you can change',
  a:'School is compulsory from age 6 to 16 ({{obbligo di istruzione}}, 10 years). That includes the first two years of high school or of an {{IeFP}} course. After 16, young people keep studying or training until they earn a diploma or a professional qualification (the goal is by age 18). Students can also change schools. In the first two years, they ask the new school by 31 January and have a talk ({{colloquio orientativo}}, not a grade); the new school helps them catch up. From the third year, they take {{esami integrativi}} in the subjects they have not studied, with at least 6 out of 10 in each. The music and dance liceo still needs its audition.',
  b:'School is required from 6 to 16 ({{obbligo di istruzione}}). You can change schools. First two years: a talk ({{colloquio orientativo}}). Later: {{esami integrativi}} on the missing subjects.',
  c:'School is required from 6 to 16. You can change schools. First two years: just a talk.',art:'mestieri'},
 {t:'After high school: university is not required',
  a:'Italian high school lasts five years and ends with the {{esame di Stato}} (called the {{maturit\u00E0}}) and a diploma. After that, students can go to {{universit\u00E0|university}}, to an {{ITS Academy}} (a 2 to 3 year technical school), or start working. The {{licei}} are designed mostly to prepare for university. The {{istituti tecnici}} and {{istituti professionali}} connect more directly to jobs, and also lead to university or ITS. {{IeFP}} gives a qualification you can use at work right away.',
  b:'After five years: the {{maturit\u00E0}} and a diploma. Then {{universit\u00E0}}, {{ITS Academy}}, or a job. University is not required.',
  c:'After five years: the {{maturit\u00E0}}. Then university, ITS, or a job. University is not required.',art:'umanistico'}
];

  h+='<footer class="small center" style="margin-top:20px">Your work stays on this computer. No names are saved. <button class="btn sm sec" data-act="clear" id="clr">Clear my work on this computer</button></footer></div><div id="live" class="live" role="status" aria-live="polite"></div>';
  ROOT.innerHTML=h;
  if(keep){window.scrollTo(0,y);if(fk){var e=$(fk);if(e)try{e.focus({preventScroll:true})}catch(x){}}}
  else{var m=$('#main')||$('h1');if(m){m.setAttribute('tabindex','-1');try{m.focus({preventScroll:true})}catch(x){}}window.scrollTo(0,0)}
}
function refreshGate(){var id=S.path&&S.step!=='done'?curId():null;if(!id)return;var cb=$('input[data-act="done"]'),ok=canDone(id),on=!!S.done[id];if(cb){cb.disabled=!(ok||on)}var w=$('#whynot');if(w)w.style.display=(ok||on)?'none':''}
function updatePv(){var pv=$('#pv');if(!pv)return;var id=curId();pv.innerHTML=pvBlocks(id==='cmp'?[5]:id==='find'?[2,3]:[1,4])}
function setStep(n){S.step=n;save();render()}
function copyText(t,msg){
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();note(ok?(msg||'Copied. Now paste it into your slide.'):'Could not copy. Select the text and press Ctrl+C.')}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){note(msg||'Copied. Now paste it into your slide.')},fb);return}}catch(e){}
  fb()}
function toggle(arr,v,max){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{arr.push(v);if(arr.length>max)arr.shift()}}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),v=t.getAttribute('data-v');
  switch(a){
   case 'say':TTS.speak(t.getAttribute('data-t'),t.getAttribute('data-l')||'it-IT');return;
   case 'path':S.path=v;S.step=1;save();render();return;
   case 'tpath':S.path=v;S.step=1;save();render();return;
   case 'tstart':S.path=null;save();render();return;
   case 'tfull':return;
   case 'sz':S.sz=Math.max(-1,Math.min(3,(S.sz||0)+parseInt(v,10)));save();applySize();return;
   case 'goto':setStep(parseInt(v,10));return;
   case 'back':if(S.step==='done')setStep(stepIds().length);else if(S.step>1)setStep(S.step-1);return;
   case 'next':if(S.step<stepIds().length)setStep(S.step+1);else{S.step='done';save();render()}return;
   case 'cprev':S.card=Math.max(0,S.card-1);save();render(true);return;
   case 'cnext':S.card=Math.min(CARDS.length-1,S.card+1);S.cardMax=Math.max(S.cardMax,S.card);save();render();document.activeElement&&0;return;
   case 'qa':S.qa[t.getAttribute('data-q')]=parseInt(v,10);save();render(true);return;
   case 'pick':if(S.school!==v){S.school=v;S.mine.subj=null;S.mine.has=null;S.edit={};}save();render(true);return;
   case 'open':S.opened=true;save();return;
   case 'fopen':S.fnd.opened=true;save();refreshGate();return;
   case 'copyq':copyText(t.getAttribute('data-t'),'Copied. Now paste it into the search box.');return;
   case 'fsug':S.fnd[t.getAttribute('data-k')]=v;save();render(true);return;
   case 'age':S.age=parseInt(v,10);save();render(true);return;
   case 'int':toggle(S.ints,v,2);save();render(true);return;
   case 'myyears':S.mine.years=parseInt(v,10);save();render(true);return;
   case 'msubj':S.mine.subj=parseInt(v,10);S.mine.has=null;save();render(true);return;
   case 'mhas':S.mine.has=parseInt(v,10);save();render(true);return;
   case 'mfocus':S.mine.focus=v;save();render(true);return;
   case 'copy':{var n=parseInt(t.getAttribute('data-n'),10),sl=buildSlides(S);copyText(slideText(sl[n-1],S));return}
   case 'copyall':{var sl2=buildSlides(S);copyText(sl2.map(function(s){return 'Slide '+s.n+': '+s.title+'\n'+slideText(s,S)}).join('\n\n'));return}
   case 'reset':{delete S.edit[parseInt(t.getAttribute('data-n'),10)];save();render(true);return}
   case 'acc':{var ta=document.activeElement&&document.activeElement.tagName==='TEXTAREA'?document.activeElement:(LASTTA||null);if(ta){var c=t.getAttribute('data-c'),s0=ta.selectionStart,s1=ta.selectionEnd;ta.value=ta.value.slice(0,s0)+c+ta.value.slice(s1);ta.selectionStart=ta.selectionEnd=s0+1;ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}else note('Tap inside a text box first.');return}
   case 'qf':S.q.frame=parseInt(v,10);S.q.fill='';save();render(true);return;
   case 'qfill':S.q.fill=v;save();render(true);return;
   case 'rstart':recStart(t.getAttribute('data-k'));return;
   case 'rstop':recStop(t.getAttribute('data-k'));return;
   case 'rsave':recSave(t.getAttribute('data-k'));return;
   case 'sign':{var k=t.getAttribute('data-k'),inp=$('#code'+k),msg=$('#signmsg'+k);if(inp&&inp.value.trim().toLowerCase()===TEACH_CODE){S.teach[k]=true;save();render(true)}else if(msg){msg.textContent='That is not the code word. Ask your teacher.';inp&&inp.select()}return}
   case 'clear':{if(t.getAttribute('data-sure')){clearAll();location.href=location.pathname+location.search.replace(/[?&]?(path)=[^&]*/,'')}else{t.setAttribute('data-sure','1');t.textContent='Click again to clear everything';}return}
  }
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('kt')&&e.target.getAttribute('data-act')==='say'){e.preventDefault();TTS.speak(e.target.getAttribute('data-t'),'it-IT')}});
var LASTTA=null;
document.addEventListener('focusin',function(e){if(e.target.tagName==='TEXTAREA'||(e.target.tagName==='INPUT'&&e.target.type==='text'))LASTTA=e.target});
document.addEventListener('input',function(e){var t=e.target,a=t.getAttribute&&t.getAttribute('data-act');
  if(a==='hs'){S.hs=t.value.slice(0,60);save();updatePv();refreshGate()}
  else if(a==='town'){S.town=t.value.slice(0,40);save();updatePv();refreshGate()}
  else if(a==='ffact'){S.fnd[t.getAttribute('data-k')]=t.value.slice(0,120);save();updatePv();refreshGate()}
  else if(a==='edit'){var n=parseInt(t.getAttribute('data-n'),10),auto=buildSlides(S)[n-1].lines.map(plainIt).join('\n');if(t.value===auto)delete S.edit[n];else S.edit[n]=t.value;save();var rb=$('[data-act="reset"][data-n="'+n+'"]');if(rb)rb.hidden=!S.edit[n];var c=$('#chk'+n);if(c)c.innerHTML=checksHtml(n,t.value)}});
document.addEventListener('change',function(e){var t=e.target,a=t.getAttribute&&t.getAttribute('data-act');if(!a)return;
  if(a==='done'){var id=curId();S.done[id]=t.checked;save();t.parentNode.classList.toggle('on',t.checked);var nx=$('[data-act="next"]');if(nx)nx.disabled=!t.checked;refreshGate();var d=$('.dots');if(d){var tmp=document.createElement('div');tmp.innerHTML=dotsHtml();d.replaceWith(tmp.firstChild)}}
  else if(a==='src'){S.src=t.value;save()}
  else if(a==='fchk'){S.fnd.chk[t.getAttribute('data-k')]=t.checked;save();t.parentNode.classList.toggle('on',t.checked);refreshGate()}
  else if(a==='fhelp'){S.fnd.help=t.checked;save();t.parentNode.classList.toggle('on',t.checked);refreshGate()}
  else if(a==='alt'){S.altRec=t.checked;save();t.parentNode.classList.toggle('on',t.checked);refreshGate()}
  else if(a==='watched'){S.watched=t.checked;save();t.parentNode.classList.toggle('on',t.checked);refreshGate()}
  else if(a==='ansdone'){S.ansDone=t.checked;save();t.parentNode.classList.toggle('on',t.checked)}
  else if(a==='self'){S.self[t.getAttribute('data-k')]=t.checked;save();t.parentNode.classList.toggle('on',t.checked)}
  else if(a==='tfull'){S.full=t.checked;save();render(true)}
  else if(a==='tjump'){S.step=parseInt(t.value,10);save();render()}});
function softRefresh(){refreshGate()}
/* ========= boot ========= */
(function(){
  TTS.init();load();
  var pp=(PARAMS.get('path')||'').toUpperCase();if(pp==='A'||pp==='B'||pp==='C'){if(S.path!==pp){S.path=pp;S.step=1}}
  if(PARAMS.get('list')==='all')S.full=true;
  if(S.step!=='done'&&(typeof S.step!=='number'||S.step<1||(S.path&&S.step>IDS[S.path].length)))S.step=1;
  render();
  window.addEventListener('resize',applySize);
})();
</script>
</body></html>
